name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-exe:
    name: Build Windows .exe
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $zip = "$env:TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          & 7z x $zip -o"$env:TEMP\ffmpeg" -y | Out-Null
          Copy-Item "$env:TEMP\ffmpeg\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe" tools\ffmpeg.exe
          Copy-Item "$env:TEMP\ffmpeg\ffmpeg-master-latest-win64-gpl\bin\ffprobe.exe" tools\ffprobe.exe
          Copy-Item "$env:TEMP\ffmpeg\ffmpeg-master-latest-win64-gpl\bin\ffplay.exe" tools\ffplay.exe

      - name: Install UPX (compressor)
        shell: pwsh
        run: choco install upx --no-progress -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: pyinstaller MediaFlow.spec

      - uses: actions/upload-artifact@v4
        with:
          name: MediaFlow-Windows
          path: dist/MediaFlow.exe

  build-apk:
    name: Build Android .apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-licenses: true

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: MediaFlow_Mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MediaFlow-Android
          path: MediaFlow_Mobile/android/app/build/outputs/apk/debug/app-debug.apk

  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y upx ffmpeg libegl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: python -m PyInstaller MediaFlow.spec

      - uses: actions/upload-artifact@v4
        with:
          name: MediaFlow-Linux
          path: dist/MediaFlow

  create-release:
    name: Create GitHub Release
    needs: [build-exe, build-apk, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      - name: Prepare release assets
        run: |
          mv MediaFlow-Android/app-debug.apk MediaFlow-Android/MediaFlow-Android.apk
          mv MediaFlow-Linux/MediaFlow MediaFlow-Linux/MediaFlow-Linux
          sha256sum MediaFlow-Windows/MediaFlow.exe MediaFlow-Linux/MediaFlow-Linux MediaFlow-Android/MediaFlow-Android.apk | sed 's|  [^ ]*/|  |' > SHA256SUMS.txt

      - name: Find release notes
        id: notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            MediaFlow-Windows/MediaFlow.exe
            MediaFlow-Linux/MediaFlow-Linux
            MediaFlow-Android/MediaFlow-Android.apk
            SHA256SUMS.txt
          name: MediaFlow ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          fail_on_unmatched_files: true
          overwrite_files: false
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
